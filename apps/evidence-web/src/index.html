<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jittle Lamp – Evidence Viewer</title>
    <meta
      name="description"
      content="Review shared browser session evidence captured with Jittle Lamp."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jittle Lamp" />
    <meta property="og:title" content="Jittle Lamp – Evidence Viewer" />
    <meta
      property="og:description"
      content="Review shared browser session evidence captured with Jittle Lamp."
    />
    <meta property="og:image" content="/img-prev.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jittle Lamp – Evidence Viewer" />
    <meta
      name="twitter:description"
      content="Review shared browser session evidence captured with Jittle Lamp."
    />
    <meta name="twitter:image" content="/img-prev.png" />
    <link rel="icon" href="/logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="app">
      <main class="jl-status-screen jl-status-screen-loading jl-boot-loader" aria-busy="true" aria-label="Loading Jittle Lamp">
        <div aria-hidden="true" class="jl-status-mesh"></div>
        <div aria-hidden="true" class="jl-status-sweep"></div>
        <section class="jl-status-panel relative w-full max-w-[34rem] animate-rise border border-border-strong px-6 py-7 shadow-pop backdrop-blur sm:px-8">
          <div class="jl-boot-brand">
            <span class="jl-boot-mark"><img src="/logo.jpg" alt="" /></span>
            <span>Jittle&nbsp;Lamp</span>
          </div>
          <div aria-hidden="true" class="jl-load-scanner">
            <div class="jl-load-orbit jl-load-orbit-a"></div>
            <div class="jl-load-orbit jl-load-orbit-b"></div>
            <div class="jl-load-console">
              <div class="jl-load-console-glass">
                <div class="jl-load-map">
                  <div class="jl-load-playhead"></div>
                  <div class="jl-load-radar"></div>
                  <div class="jl-load-path jl-load-path-a"></div>
                  <div class="jl-load-path jl-load-path-b"></div>
                  <div class="jl-load-path jl-load-path-c"></div>
                  <span class="jl-load-node jl-load-node-alpha"></span>
                  <span class="jl-load-node jl-load-node-bravo"></span>
                  <span class="jl-load-node jl-load-node-charlie"></span>
                  <span class="jl-load-node jl-load-node-delta"></span>
                  <span class="jl-load-node jl-load-node-echo"></span>
                  <span class="jl-load-node jl-load-node-foxtrot"></span>
                </div>
                <div class="jl-load-bars">
                  <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                  <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                </div>
              </div>
            </div>
          </div>
          <div class="mt-7 text-center">
            <h1 class="font-display text-2xl font-semibold leading-tight tracking-tight text-foreground sm:text-3xl">
              Preparing your workspace
            </h1>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
