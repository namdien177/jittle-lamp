      rel="stylesheet"
    />
    <script>
      // Apply the persisted (or system) theme before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem("jl-theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="app">
      <main class="jl-status-screen jl-status-screen-loading jl-boot-loader" aria-busy="true" aria-label="Loading Jittle Lamp">
        <div class="jl-status-loading">
          <div aria-hidden="true" class="jl-modern-loader">
            <span class="jl-modern-loader-ring"></span>
          </div>
          <h1 class="jl-status-loading-title">Loading workspace</h1>
        </div>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
