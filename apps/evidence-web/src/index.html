      name="description"
      content="Review shared browser session evidence captured with Jittle Lamp."

    <meta property="og:site_name" content="Jittle Lamp" />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    />

  </head>
  <body>
    <div id="app">
      <main class="jl-status-screen jl-status-screen-loading jl-boot-loader" aria-busy="true" aria-label="Loading Jittle Lamp">
        <div aria-hidden="true" class="jl-status-mesh"></div>
        <div aria-hidden="true" class="jl-status-sweep"></div>
        <section class="jl-status-panel relative w-full max-w-[22rem] animate-rise border border-border-strong px-6 py-7 shadow-pop backdrop-blur">
          <div aria-hidden="true" class="jl-modern-loader">
            <span class="jl-modern-loader-ring"></span>
            <span class="jl-modern-loader-dot"></span>
          </div>
          <div class="mt-5 text-center">
            <h1 class="font-display text-xl font-semibold leading-tight tracking-tight text-foreground">
              Loading workspace
            </h1>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
