<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jittle-lamp</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="hero">
        <p class="eyebrow">Local browser recorder</p>
        <div class="hero-row">
          <h1>jittle-lamp</h1>
          <span class="phase-pill" data-role="status-badge">idle</span>
        </div>
        <p class="summary" data-role="message-value"></p>
      </header>

      <section class="cloud-strip">
        <div class="companion-copy">
          <p class="label">Cloud upload</p>
          <strong class="companion-title" data-role="cloud-status">Checking…</strong>
          <p class="value mono wrap" data-role="cloud-route">Open Jittle Lamp web and sign in.</p>
        </div>
        <button class="companion-pill menu-trigger" data-role="cloud-menu-button" data-status="unknown" type="button">
          <span data-role="cloud-pill">unknown</span>
        </button>
        <div class="cloud-menu" data-role="cloud-menu" hidden>
          <button type="button" data-role="open-evidence-button">Evidence list</button>
          <button type="button" data-role="logout-button">Log out</button>
        </div>
      </section>

      <section class="companion-strip">
        <div class="companion-copy">
          <p class="label">Desktop companion</p>
          <strong class="companion-title" data-role="companion-status">Checking…</strong>
          <p class="value mono wrap" data-role="companion-route">http://127.0.0.1:48115</p>
          <a
            class="companion-download"
            data-role="companion-download"
            href="https://github.com/namdien177/jittle-lamp"
            target="_blank"
            rel="noopener noreferrer"
            hidden
          >
            Download Companion App
          </a>
        </div>
        <span class="companion-pill" data-role="companion-pill" data-status="offline">offline</span>
      </section>

      <section class="details">
        <div class="detail-row">
          <span class="label">Session</span>
          <span class="value mono" data-role="session-value">—</span>
        </div>
        <div class="detail-row">
          <span class="label">Title</span>
          <input
            class="value title-input"
            data-role="title-value"
            type="text"
            maxlength="160"
            value="No session yet"
            disabled
          />
        </div>
        <div class="detail-row">
          <span class="label">URL</span>
          <span class="value mono wrap" data-role="url-value">Open an http(s) page to start recording.</span>
        </div>
        <div class="detail-row">
          <span class="label">Events</span>
          <span class="value" data-role="events-value">0</span>
        </div>
        <div class="detail-row">
          <span class="label">Artifacts</span>
          <span class="value mono wrap pre" data-role="artifact-value">—</span>
        </div>
      </section>

      <footer class="actions">
        <div class="recording-control-row">
          <button class="button primary" data-role="start-button" type="button">
            <i data-lucide="play" aria-hidden="true"></i>
            <span>Start capture</span>
          </button>
          <button class="button secondary" data-role="stop-button" type="button">
            <i data-lucide="circle-stop" aria-hidden="true"></i>
            <span>Stop</span>
          </button>
          <button class="button danger abort-button" data-role="abort-button" type="button" hidden>
            <i data-lucide="x" aria-hidden="true"></i>
            <span>Abort</span>
          </button>
        </div>
        <label class="recording-name-field">
          <span class="label">New recording name</span>
          <input
            class="title-input recording-name-input"
            data-role="draft-title-value"
            type="text"
            maxlength="160"
            placeholder="Use current page title"
          />
        </label>
      </footer>
    </main>

    <script type="module" src="./popup.js"></script>
  </body>
</html>
