<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jittle-lamp</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="hero">
        <p class="eyebrow">Local browser recorder</p>
        <div class="hero-row">
          <h1>jittle-lamp</h1>
          <span class="phase-pill" data-role="status-badge">idle</span>
        </div>
        <p class="summary" data-role="message-value"></p>
      </header>

      <section class="cloud-strip">
        <div class="companion-copy">
          <p class="label">Cloud upload</p>
          <strong class="companion-title" data-role="cloud-status">Checking…</strong>
          <p class="value mono wrap" data-role="cloud-route">Open Jittle Lamp web and sign in.</p>
        </div>
        <button class="companion-pill menu-trigger" data-role="cloud-menu-button" data-status="unknown" type="button">
          <span data-role="cloud-pill">unknown</span>
        </button>
        <div class="cloud-menu" data-role="cloud-menu" hidden>
          <button type="button" data-role="open-evidence-button">Evidence list</button>
          <button type="button" data-role="logout-button">Log out</button>
        </div>
      </section>

      <section class="companion-strip">
        <div class="companion-copy">
          <p class="label">Desktop companion</p>
          <strong class="companion-title" data-role="companion-status">Checking…</strong>
          <p class="value mono wrap" data-role="companion-route">http://127.0.0.1:48115</p>
          <a
            class="companion-download"
            data-role="companion-download"
            href="https://github.com/namdien177/jittle-lamp"
            target="_blank"
            rel="noopener noreferrer"
            hidden
          >
            Download Companion App
          </a>
        </div>
        <span class="companion-pill" data-role="companion-pill" data-status="offline">offline</span>
      </section>

      <section class="details">
        <div class="detail-row">
          <span class="label">Session</span>
          <span class="value mono" data-role="session-value">—</span>
        </div>
        <div class="detail-row">
          <span class="label">Title</span>
          <input
            class="value title-input"
            data-role="title-value"
            type="text"
            maxlength="160"
            value="No session yet"
            disabled
          />
        </div>
        <div class="detail-row">
          <span class="label">URL</span>
          <span class="value mono wrap" data-role="url-value">Open an http(s) page to start recording.</span>
        </div>
        <div class="detail-row">
          <span class="label">Events</span>
          <span class="value" data-role="events-value">0</span>
        </div>
        <div class="detail-row">
          <span class="label">Artifacts</span>
          <span class="value mono wrap pre" data-role="artifact-value">—</span>
        </div>
      </section>

      <footer class="actions">
        <div class="recording-options" aria-label="Recording options">
          <label class="recording-option sound-option" title="Play captured sound while recording">
            <span class="option-label">Sound</span>
            <input data-role="sound-toggle" type="checkbox" aria-label="Play captured sound while recording" />
          </label>
          <div class="recording-option target-option">
            <span class="option-label">Target</span>
            <div class="target-segment" role="group" aria-label="Recording target">
              <button
                class="target-button"
                data-capture-target="tab"
                type="button"
                title="Record active tab"
                aria-label="Record active tab"
                aria-pressed="true"
              >
                <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                  <rect width="18" height="18" x="3" y="3" rx="2"></rect>
                  <path d="M3 9h18"></path>
                </svg>
              </button>
              <button
                class="target-button"
                data-capture-target="desktop"
                type="button"
                title="Record selected screen or window"
                aria-label="Record selected screen or window"
                aria-pressed="false"
              >
                <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                  <rect width="20" height="14" x="2" y="3" rx="2"></rect>
                  <line x1="8" x2="16" y1="21" y2="21"></line>
                  <line x1="12" x2="12" y1="17" y2="21"></line>
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div class="recording-control-row">
          <button class="button primary" data-role="start-button" type="button">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
              <polygon points="6 3 20 12 6 21 6 3"></polygon>
            </svg>
            <span>Start capture</span>
          </button>
          <button class="button secondary finish-button" data-role="stop-button" type="button" title="Finish recording" aria-label="Finish recording" hidden>
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"></circle>
              <rect x="9" y="9" width="6" height="6" rx="1"></rect>
            </svg>
            <span>Finish recording</span>
          </button>
          <button class="button danger icon-button abort-button" data-role="abort-button" type="button" title="Abort recording" aria-label="Abort recording" hidden>
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
          </button>
        </div>
        <label class="recording-name-field">
          <span class="label">New recording name</span>
          <input
            class="title-input recording-name-input"
            data-role="draft-title-value"
            type="text"
            maxlength="160"
            placeholder="Use current page title"
          />
        </label>
      </footer>
    </main>

    <script type="module" src="./popup.js"></script>
  </body>
</html>
