name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check version sync
        run: bun run release:check-version

      - name: Lint backend
        run: bun run --cwd apps/backend lint

      - name: Typecheck backend
        run: bun run --cwd apps/backend typecheck

      - name: Test backend
        run: bun --cwd apps/backend test --timeout=15000

      - name: Typecheck workspace
        run: bun run typecheck

      - name: Run tests
        run: bun test tests apps/mcp/test packages/e2e-runner/test --timeout=15000

      - name: Install Chromium for the runner browser test
        run: bunx playwright install --with-deps chromium

      # The engine child runs under Node and resolves @jittle-lamp/shared to its dist/.
      - name: Build the shared package for the runner
        run: bun run --cwd packages/shared build:js

      - name: Runner browser test (mock model)
        run: bun test packages/e2e-runner/browser --timeout=300000
        env:
          E2E_TELEMETRY_DISABLED: "1"

      - name: Build workspace
        run: bun run build

  # The macOS app's platform-independent crates: archive model, library, companion server (the
  # extension's contract), zip, timeline, and the backend client. Capture, media and AppKit crates
  # need a logged-in macOS session and are tested locally.
  desktop-core:
    runs-on: macos-15

    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/target
          key: desktop-core-${{ runner.os }}-${{ hashFiles('apps/desktop/Cargo.lock') }}

      - name: Test jl-core and jl-api
        run: cargo test -p jl-core -p jl-api --locked
