name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check version sync
        run: bun run release:check-version

      - name: Lint backend
        run: bun run --cwd apps/backend lint

      - name: Typecheck backend
        run: bun run --cwd apps/backend typecheck

      - name: Test backend
        run: bun --cwd apps/backend test --timeout=15000

      - name: Typecheck workspace
        run: bun run typecheck

      - name: Run tests
        run: bun test tests apps/mcp/test packages/e2e-runner/test --timeout=15000

      - name: Install Chromium for the runner browser test
        run: bunx playwright install --with-deps chromium

      # The engine child runs under Node and resolves @jittle-lamp/shared to its dist/.
      - name: Build the shared package for the runner
        run: bun run --cwd packages/shared build:js

      - name: Runner browser test (mock model)
        run: bun test packages/e2e-runner/browser --timeout=300000
        env:
          E2E_TELEMETRY_DISABLED: "1"

      - name: Build workspace
        run: bun run build
