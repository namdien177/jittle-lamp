name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Verify release source
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "namdien177/jittle-lamp" || "$GITHUB_EVENT_NAME" != "push" || "$GITHUB_REF_TYPE" != "tag" || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable release tag push in namdien177/jittle-lamp." >&2
            exit 1
          fi
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "Release tags must point at the current main HEAD." >&2
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check version sync against tag
        run: bun run release:check-version "$GITHUB_REF_NAME"

      - name: Typecheck workspace
        run: bun run typecheck

      - name: Run tests
        run: bun test --timeout=15000

      - name: Build workspace
        run: bun run build

  build-extension:
    needs: validate-tag
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build extension bundle
        run: bun run build:shared && bun run build:extension

      - name: Package extension release asset
        run: bun run release:package-extension "${{ needs.validate-tag.outputs.version }}"

      - name: Upload extension asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-extension
          path: release-artifacts/*.zip

  build-desktop:
    needs: validate-tag
    runs-on: macos-14
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Determine signing mode
        id: signing
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          if [[ -n "$CSC_LINK" && -n "$CSC_KEY_PASSWORD" ]] && [[ ( -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ) || ( -n "$APPLE_API_KEY" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ) ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package macOS desktop release
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          JITTLE_LAMP_API_ORIGIN: ${{ secrets.JITTLE_LAMP_API_ORIGIN }}
          JITTLE_LAMP_WEB_ORIGIN: ${{ secrets.JITTLE_LAMP_WEB_ORIGIN }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.signed == 'true' && 'true' || 'false' }}
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bun run --cwd apps/desktop package:ci

      - name: Verify macOS app code signature
        shell: bash
        run: |
          set -euo pipefail

          apps=()
          while IFS= read -r app; do
            apps+=("$app")
          done < <(find apps/desktop/artifacts -name "Jittle Lamp.app" -type d)
          if [[ ${#apps[@]} -ne 1 ]]; then
            echo "Expected exactly one packaged macOS app bundle, found ${#apps[@]}"
            find apps/desktop/artifacts -maxdepth 3 -type d -name "*.app" -print
            exit 1
          fi

          app_bundle="${apps[0]}"
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          signature_details="$(codesign -dv --verbose=4 "$app_bundle" 2>&1)"
          echo "$signature_details"

          if [[ "${{ steps.signing.outputs.signed }}" == "false" ]] && ! grep -q "Signature=adhoc" <<< "$signature_details"; then
            echo "Expected unsigned release fallback to use an ad-hoc macOS signature."
            exit 1
          fi

      - name: Collect macOS release artifact
        env:
          JL_MACOS_SIGNED: ${{ steps.signing.outputs.signed }}
        run: bun run release:collect-desktop "${{ needs.validate-tag.outputs.version }}"

      - name: Verify collected desktop artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(release-artifacts/jittle-lamp-desktop-v${{ needs.validate-tag.outputs.version }}-macos-arm64-*.dmg)
          if [[ ${#artifacts[@]} -ne 1 ]]; then
            echo "Expected exactly one collected desktop DMG, found ${#artifacts[@]}"
            ls -lah release-artifacts
            exit 1
          fi
          ls -lh "${artifacts[0]}"

      - name: Upload desktop asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-desktop
          path: release-artifacts/*
          if-no-files-found: error

  publish-release:
    permissions:
      contents: write
    needs:
      - build-extension
      - build-desktop
      - validate-tag
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/* --title "$GITHUB_REF_NAME" --generate-notes

  publish-chrome-extension:
    needs:
      - build-extension
      - build-desktop
      - validate-tag
    permissions:
      contents: read
      id-token: write
      actions: read
    uses: namdien177/jittle-lamp/.github/workflows/publish-chrome.yml@main
