# Cloud runner pool: N identical workers for one pool (design.md §5.4, §10.1).
#   cp runner.env.sample runner.env   # set JL_API_ORIGIN and JL_RUNNER_TOKEN
#   docker compose -f deploy/runner/compose.yaml up -d --scale runner=2
# Each container registers once and keeps its worker credential in the shared state volume under
# a file named after its host name, so replicas are distinct workers. The pool registration token
# registers any number of workers and may stay in runner.env.
services:
  runner:
    image: jittle-lamp/e2e-runner:${JL_RUNNER_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/runner/Dockerfile
    # All runner settings, including JL_RUNNER_CONCURRENCY, come from runner.env. Do not add an
    # `environment:` entry for a variable runner.env sets: it would override the file.
    env_file: runner.env
    # Chromium needs more shared memory than Docker's 64 MB default.
    shm_size: 1gb
    init: true
    restart: unless-stopped
    volumes:
      - runner-state:/home/pwuser/.config/jittle-lamp/runner
      - runner-work:/var/lib/jl-e2e-runner
    deploy:
      resources:
        limits:
          memory: 3g
    # A case may run up to the 15 min attempt deadline; let it finish on `docker compose down`.
    stop_grace_period: 20m

volumes:
  runner-state:
  runner-work:
