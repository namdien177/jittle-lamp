workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: "$CI_COMMIT_TAG"
    - when: never

stages:
  - verify
  - containerize

variables:
  GIT_DEPTH: "0"

verify:
  stage: verify
  image: oven/bun:1.3.14
  tags:
    - v2-nonprod
  script:
    - bun install --frozen-lockfile
    - bun run release:check-version
    - bun run --cwd apps/backend lint
    - bun run --cwd apps/backend typecheck
    - bun --cwd apps/backend test --timeout=15000
    - bun run typecheck
    - bun test tests --timeout=15000
    - bun run build

build_backend_image:
  stage: containerize
  image: moby/buildkit:v0.29.0
  tags:
    - v2-nonprod
  services:
    - name: moby/buildkit:v0.29.0
      alias: buildkitd
      entrypoint:
        - buildkitd
      command:
        - --addr
        - tcp://0.0.0.0:1234
        - --oci-worker-snapshotter=overlayfs
  variables:
    BUILDKIT_HOST: tcp://buildkitd:1234
  needs:
    - verify
  script:
    - |
      buildctl build \
        --frontend dockerfile.v0 \
        --local context="$CI_PROJECT_DIR" \
        --local dockerfile="$CI_PROJECT_DIR" \
        --opt filename=Dockerfile \
        --output type=oci,dest=/tmp/jittle-lamp-backend.oci.tar
    - test -s /tmp/jittle-lamp-backend.oci.tar
    - rm /tmp/jittle-lamp-backend.oci.tar
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
