workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: "$CI_COMMIT_TAG"
    - when: never

stages:
  - verify
  - containerize

variables:
  GIT_DEPTH: "0"
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend"

verify:
  stage: verify
  image: oven/bun:1.3.14
  tags:
    - v2-nonprod
  script:
    - bun install --frozen-lockfile
    - bun run release:check-version
    - bun run --cwd apps/backend lint
    - bun run --cwd apps/backend typecheck
    - bun --cwd apps/backend test --timeout=15000
    - bun run typecheck
    - bun test tests --timeout=15000
    - bun run build

containerize_backend:
  stage: containerize
  image: moby/buildkit:v0.29.0
  tags:
    - v2-nonprod
  services:
    - name: moby/buildkit:v0.29.0
      alias: buildkitd
      entrypoint:
        - buildkitd
      command:
        - --addr
        - tcp://0.0.0.0:1234
        - --oci-worker-snapshotter=overlayfs
  variables:
    BUILDKIT_HOST: tcp://buildkitd:1234
  needs:
    - verify
  before_script:
    - mkdir -p "$HOME/.docker"
    - AUTH="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
    - printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$AUTH" > "$HOME/.docker/config.json"
  script:
    - IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHA}"
    - IMAGE_REFERENCE="${BACKEND_IMAGE}:${IMAGE_TAG}"
    - |
      buildctl build \
        --frontend dockerfile.v0 \
        --local context="$CI_PROJECT_DIR" \
        --local dockerfile="$CI_PROJECT_DIR" \
        --opt filename=Dockerfile \
        --import-cache type=registry,ref="${BACKEND_IMAGE}:buildcache" \
        --export-cache type=registry,ref="${BACKEND_IMAGE}:buildcache",mode=max \
        --output type=image,name="${IMAGE_REFERENCE}",push=true
    - printf 'BACKEND_IMAGE_REFERENCE=%s\n' "$IMAGE_REFERENCE" > backend-image.env
  artifacts:
    reports:
      dotenv: backend-image.env
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
